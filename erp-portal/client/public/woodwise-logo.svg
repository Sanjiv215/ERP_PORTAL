<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Top Teal Wave Section -->
    <rect width="512" height="512" fill="#19A2BF" />

    <!-- Center White Wave Ribbon -->
    <path d="M -20 230 C 140 230, 220 120, 340 160 C 420 185, 480 250, 530 250 L 530 400 C 440 400, 360 410, 270 360 C 160 300, 80 380, -20 380 Z" fill="#FFFFFF" />

    <!-- Bottom Deep Navy Wave Section -->
    <path d="M -20 380 C 80 380, 160 300, 270 360 C 360 410, 440 400, 530 400 L 530 530 L -20 530 Z" fill="#0F5394" />

    <!-- Brand Typography "The WoodWise" -->
    <text x="140" y="235" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="700" fill="#0A111C" letter-spacing="-1">The</text>
    <text x="80" y="305" font-family="'Georgia', 'Times New Roman', serif" font-size="74" font-weight="700" fill="#0A111C" letter-spacing="-2">WoodWise</text>
  </g>
  <!-- Outer Ring Border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#0F5394" stroke-width="4" stroke-opacity="0.2" />
</svg>
